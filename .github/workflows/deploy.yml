# main → preview channel (app) + preview Worker. Production is a manual promotion.
# workflow_dispatch is the no-laptop control panel: it is how a phone or a cloud session
# ships JS, promotes production and orders the rare native build (docs/WORKFLOW.md, loop 2b).
#
#   gh workflow run deploy.yml -f action=publish-preview
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [publish-preview, promote-production, build-development, build-preview, build-production]
        required: true

jobs:
  # `secrets` cannot be read in a job-level `if`, so it is turned into an output here. Without
  # this a repo with no secrets fails every push to main, and a red main from the phone is
  # indistinguishable from a real breakage.
  secrets-check:
    runs-on: ubuntu-latest
    outputs:
      expo: ${{ steps.check.outputs.expo }}
      cloudflare: ${{ steps.check.outputs.cloudflare }}
    steps:
      - id: check
        run: |
          expo=${{ secrets.EXPO_TOKEN != '' }}
          cloudflare=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          echo "expo=$expo" >> "$GITHUB_OUTPUT"
          echo "cloudflare=$cloudflare" >> "$GITHUB_OUTPUT"
          [ "$expo" = true ] || echo "::warning::EXPO_TOKEN is not set: no update will reach the phone. See docs/WORKFLOW.md."
          [ "$cloudflare" = true ] || echo "::warning::CLOUDFLARE_API_TOKEN/ACCOUNT_ID not set: the Worker will not deploy. See docs/WORKFLOW.md."

  api-preview:
    needs: secrets-check
    if: github.event_name == 'push' && needs.secrets-check.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Schema first: a Worker that expects a table the database does not have yet fails every
      # request. If this step fails (for instance a token without D1 edit rights), nothing is
      # deployed and the old Worker keeps running on the old schema.
      - name: Apply D1 migrations (preview)
        working-directory: api
        run: npx wrangler d1 migrations apply sivoov-run-preview --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker (preview env)
        working-directory: api
        run: npx wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Push to main, or ask for it by hand from a phone. Either way the standalone preview shell
  # picks the update up the next time it is opened.
  app-preview:
    needs: secrets-check
    if: (github.event_name == 'push' || inputs.action == 'publish-preview') && needs.secrets-check.outputs.expo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Publish update to the preview channel
        working-directory: app
        run: eas update --channel preview --message "${{ github.event.head_commit.message || format('manual from {0}', github.sha) }}" --non-interactive

  promote-production:
    needs: secrets-check
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote-production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Apply D1 migrations (production)
        working-directory: api
        run: npx wrangler d1 migrations apply sivoov-run --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker (production)
        working-directory: api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish update to the production channel
        working-directory: app
        run: eas update --channel production --message "${{ github.sha }}" --non-interactive

  native-build:
    needs: secrets-check
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.action, 'build-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: EAS Build (cloud, both platforms)
        working-directory: app
        run: eas build --profile ${{ inputs.action == 'build-development' && 'development' || inputs.action == 'build-preview' && 'preview' || 'production' }} --platform all --non-interactive --no-wait
