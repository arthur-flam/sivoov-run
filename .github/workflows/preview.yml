# Every PR gets its own EAS Update branch. Open it from the dev client's launcher on the
# phone, or scan the QR the action comments on the PR. JS-only changes need no build.
name: Preview update

on:
  pull_request:
    paths:
      - 'app/**'
      - 'shared/**'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    outputs:
      expo: ${{ steps.check.outputs.expo }}
    steps:
      - id: check
        run: |
          expo=${{ secrets.EXPO_TOKEN != '' }}
          echo "expo=$expo" >> "$GITHUB_OUTPUT"
          [ "$expo" = true ] || echo "::warning::EXPO_TOKEN is not set: this PR gets no update branch. See docs/WORKFLOW.md."

  update:
    needs: secrets-check
    if: needs.secrets-check.outputs.expo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # The action runs `command` itself, where an environment variable would not expand, so the
      # title is cleaned first: without quotes it cannot end the argument early (a quote in PR #5's
      # title broke the command) or pass eas an option of its own.
      - name: The PR title as an update message
        id: message
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "text=$(printf '%s' "$TITLE" | tr -d '"\\`$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Publish update to a branch named after the PR, comment QR on the PR
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --branch pr-${{ github.event.pull_request.number }} --message "${{ steps.message.outputs.text }}" --non-interactive
          working-directory: app
          # v8 validates against "dev-client" only, despite documenting "dev-build"; both mean a dev build.
          qr-target: dev-client
