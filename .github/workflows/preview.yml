# Every PR gets its own EAS Update branch. Open it from the dev client's launcher on the
# phone, or scan the QR the action comments on the PR. JS-only changes need no build.
name: Preview update

on:
  pull_request:
    paths:
      - 'app/**'
      - 'shared/**'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    outputs:
      expo: ${{ steps.check.outputs.expo }}
    steps:
      - id: check
        run: |
          expo=${{ secrets.EXPO_TOKEN != '' }}
          echo "expo=$expo" >> "$GITHUB_OUTPUT"
          [ "$expo" = true ] || echo "::warning::EXPO_TOKEN is not set: this PR gets no update branch. See docs/WORKFLOW.md."

  update:
    needs: secrets-check
    if: needs.secrets-check.outputs.expo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # The action runs `command` itself, where an environment variable would not expand, so the
      # title is cleaned first: without quotes it cannot end the argument early (a quote in PR #5's
      # title broke the command) or pass eas an option of its own.
      - name: The PR title as an update message
        id: message
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "text=$(printf '%s' "$TITLE" | tr -d '"\\`$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      # The app's Sentry DSN, inlined into the bundle (docs/WORKFLOW.md, Secrets). Only when the
      # secret exists: without it the app sends nothing, and an empty variable would hide one set
      # in the EAS environment.
      - name: Sentry DSN for the bundle
        env:
          DSN: ${{ secrets.SENTRY_DSN_APP }}
        run: '[ -z "$DSN" ] || echo "EXPO_PUBLIC_SENTRY_DSN=$DSN" >> "$GITHUB_ENV"'
      - name: Publish update to a branch named after the PR, comment QR on the PR
        uses: expo/expo-github-action/preview@v8
        # Opened in the dev client: its config, pointed at preview (see deploy.yml).
        env:
          APP_VARIANT: development
          EXPO_PUBLIC_API_URL: https://preview.run.sivoov.app
        with:
          command: eas update --branch pr-${{ github.event.pull_request.number }} --environment preview --message "${{ steps.message.outputs.text }}" --non-interactive
          working-directory: app
          # v8 validates against "dev-client" only, despite documenting "dev-build"; both mean a dev build.
          qr-target: dev-client
      # The update's source maps (in dist/, matched to the bundle by its debug id). Optional: without
      # the token, stack traces stay minified; a failed upload never fails the publish.
      - name: Source maps to Sentry
        working-directory: app
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: https://sentry.io/
        run: |
          [ -n "$SENTRY_AUTH_TOKEN" ] || { echo "SENTRY_AUTH_TOKEN not set: no source maps for this update."; exit 0; }
          npx sentry-expo-upload-sourcemaps dist || echo "::warning::Sentry source maps were not uploaded; the update is published."
